  function drawBossDemon(c, b) {
    const t = b.t;
    // 披风
    c.fillStyle = 'rgba(90,40,140,0.85)';
    c.strokeStyle = PAL.outline;
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(-58, -10);
    c.quadraticCurveTo(-92, 50, -60, 96);
    c.lineTo(60, 96);
    c.quadraticCurveTo(92, 50, 58, -10);
    c.closePath();
    c.fill();
    c.stroke();
    // 漂浮能量球
    for (let i = 0; i < 3; i++) {
      const a = t * 1.6 + i * (TAU / 3);
      const ox = Math.cos(a) * 92, oy = Math.sin(a) * 58;
      c.fillStyle = ['#ff9ad5', '#ffe066', '#8ef7c1'][i];
      c.globalAlpha = 0.9;
      circle(c, ox, oy, 10 + Math.sin(t * 4 + i) * 2);
      c.fill();
      c.globalAlpha = 0.25;
      circle(c, ox, oy, 19);
      c.fill();
      c.globalAlpha = 1;
    }
    // 身体
    const g = c.createRadialGradient(-18, -24, 10, 0, 0, 66);
    g.addColorStop(0, '#c9a4ff');
    g.addColorStop(0.6, '#9b6cf0');
    g.addColorStop(1, '#6b3fc0');
    c.fillStyle = g;
    c.strokeStyle = PAL.outline;
    c.lineWidth = 4;
    circle(c, 0, 0, 62);
    c.fill(); c.stroke();
    bossCrown(c, -74, 1);
    // 眼睛（发光）
    c.fillStyle = '#fff';
    c.beginPath(); c.ellipse(-19, -6, 13, 15, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(19, -6, 13, 15, 0, 0, TAU); c.fill();
    c.fillStyle = '#3a1f6e';
    c.beginPath(); c.arc(-18, -3, 6.4, 0, TAU); c.fill();
    c.beginPath(); c.arc(20, -3, 6.4, 0, TAU); c.fill();
    c.fillStyle = '#ffe066';
    c.beginPath(); c.arc(-18, -3, 3, 0, TAU); c.fill();
    c.beginPath(); c.arc(20, -3, 3, 0, TAU); c.fill();
    // 嘴
    c.strokeStyle = PAL.outline;
    c.lineWidth = 3.4;
    c.beginPath();
    c.arc(0, 16, 14, 0.12 * Math.PI, 0.88 * Math.PI);
    c.stroke();
    c.fillStyle = 'rgba(255,150,210,0.5)';
    c.beginPath(); c.ellipse(-38, 14, 10, 6, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(38, 14, 10, 6, 0, 0, TAU); c.fill();
  }

  /* ===================================================================
     22. 子弹 / 道具 / 粒子绘制
     =================================================================== */
  function drawBullets(c) {
    c.save();
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      if (b.kind === 'star') {
        c.save();
        c.translate(b.x, b.y);
        c.rotate(b.rot);
        c.globalAlpha = 0.30;
        c.fillStyle = b.color;
        circle(c, 0, 0, b.r + 4); c.fill();
        c.globalAlpha = 1;
        drawStarShape(c, 0, 0, b.r + 1, 5, 0.45, 0);
        c.fillStyle = b.color;
        c.fill();
        c.strokeStyle = 'rgba(43,35,80,0.8)';
        c.lineWidth = 2;
        c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.95)';
        circle(c, 0, 0, b.r * 0.4);
        c.fill();
        c.restore();
      } else {
        const hw = b.r * 0.58, hh = b.r * 1.65;
        // 拖尾光带
        const tg = c.createLinearGradient(b.x, b.y, b.x, b.y + hh * 2.1);
        tg.addColorStop(0, b.color);
        tg.addColorStop(1, 'rgba(255,255,255,0)');
        c.globalAlpha = 0.55;
        c.fillStyle = tg;
        c.beginPath();
        c.moveTo(b.x - hw * 0.75, b.y + hh * 0.1);
        c.quadraticCurveTo(b.x, b.y + hh * 2.2, b.x + hw * 0.75, b.y + hh * 0.1);
        c.closePath();
        c.fill();
        c.globalAlpha = 1;
        // 弹体（实心饱和色，尖头）
        c.fillStyle = b.color;
        c.beginPath();
        c.moveTo(b.x, b.y - hh);
        c.quadraticCurveTo(b.x + hw, b.y - hh * 0.15, b.x + hw * 0.55, b.y + hh * 0.5);
        c.quadraticCurveTo(b.x, b.y + hh * 0.95, b.x - hw * 0.55, b.y + hh * 0.5);
        c.quadraticCurveTo(b.x - hw, b.y - hh * 0.15, b.x, b.y - hh);
        c.closePath();
        c.fill();
        c.strokeStyle = 'rgba(43,35,80,0.55)';
        c.lineWidth = 1.8;
        c.stroke();
        // 尖端高光
        c.fillStyle = 'rgba(255,255,255,0.95)';
        circle(c, b.x, b.y - hh * 0.52, hw * 0.44);
        c.fill();
      }
    }
    c.restore();
  }

  function drawEBullets(c) {
    c.save();
    for (let i = 0; i < ebullets.length; i++) {
      const b = ebullets[i];
      const pulse = 0.92 + Math.sin(Game.t * 10 + b.x * 0.1) * 0.08;
      c.globalAlpha = 0.26;
      c.fillStyle = b.color;
      circle(c, b.x, b.y, b.r * 2.0 * pulse);
      c.fill();
      c.globalAlpha = 1;
      c.fillStyle = b.color;
      circle(c, b.x, b.y, b.r * pulse);
      c.fill();
      c.strokeStyle = 'rgba(43,35,80,0.75)';
      c.lineWidth = 2.2;
      c.stroke();
      c.fillStyle = 'rgba(255,255,255,0.92)';
      circle(c, b.x, b.y, b.r * 0.42 * pulse);
      c.fill();
    }
    c.restore();
  }

  function drawPickups(c) {
    for (let i = 0; i < pickups.length; i++) {
      const p = pickups[i];
      const bob = Math.sin(p.t * 4 + p.x) * 3;
      c.save();
      c.translate(p.x, p.y + bob);
      const fade = p.life < 3 ? (0.35 + Math.abs(Math.sin(p.t * 8)) * 0.65) : 1;
      c.globalAlpha = fade;

      if (p.type === 'star') {
        c.rotate(Math.sin(p.t * 2) * 0.25);
        c.fillStyle = 'rgba(255,217,61,0.3)';
        circle(c, 0, 0, 20); c.fill();
        c.fillStyle = '#ffd93d';
        drawStarShape(c, 0, 0, 13, 5, 0.46, 0);
        c.fill();
        c.strokeStyle = '#e8a300';
        c.lineWidth = 2.2;
        c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.85)';
        drawStarShape(c, -2, -2, 6, 5, 0.46, 0);
        c.fill();
      } else {
        const meta = PICK_META[p.type];
        c.fillStyle = 'rgba(255,255,255,0.25)';
        circle(c, 0, 0, 24 + Math.sin(p.t * 5) * 2); c.fill();
        c.fillStyle = meta.color;
        circle(c, 0, 0, 18);
        c.fill();
        c.strokeStyle = '#fff';
        c.lineWidth = 3.4;
        c.stroke();
        if (p.type === 'heart') {
          drawHeart(c, 0, 1, 20, true);
        } else if (p.type === 'shield') {
          c.strokeStyle = '#fff';
          c.lineWidth = 3;
          c.beginPath();
          c.moveTo(0, -9);
          c.lineTo(8, -4);
          c.lineTo(8, 3);
          c.quadraticCurveTo(8, 10, 0, 12);
          c.quadraticCurveTo(-8, 10, -8, 3);
          c.lineTo(-8, -4);
          c.closePath();
          c.stroke();
        } else if (p.type === 'rainbow') {
          const cols = ['#ff6b6b', '#ffd166', '#8ef7c1', '#7ecbff'];
          for (let k = 0; k < 4; k++) {
            c.strokeStyle = cols[k];
            c.lineWidth = 2.6;
            c.beginPath();
            c.arc(0, 4, 11 - k * 2.6, Math.PI, TAU);
            c.stroke();
          }
        } else if (p.type === 'lightning') {
          c.fillStyle = '#fff';
          c.beginPath();
          c.moveTo(2, -12); c.lineTo(-6, 2); c.lineTo(0, 2);
          c.lineTo(-2, 12); c.lineTo(7, -3); c.lineTo(1, -3);
          c.closePath(); c.fill();
        } else if (p.type === 'starw') {
          c.fillStyle = '#fff';
          drawStarShape(c, 0, 0, 11, 5, 0.46, 0); c.fill();
          c.fillStyle = meta.color;
          drawStarShape(c, 0, 0, 6, 5, 0.46, 0); c.fill();
        }
      }
      c.restore();
    }
  }

  function drawParticles(c) {
    c.save();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const a = clamp(p.life / p.max, 0, 1);
      c.globalAlpha = a;
      if (p.kind === 'star') {
        c.save();
        c.translate(p.x, p.y);
        c.rotate(p.rot);
        c.fillStyle = p.color;
        drawStarShape(c, 0, 0, p.size * (0.5 + a * 0.7), 5, 0.45, 0);
        c.fill();
        c.restore();
      } else if (p.kind === 'bubble') {
        c.strokeStyle = p.color;
        c.lineWidth = 2;
        circle(c, p.x, p.y, p.size * (1.4 - a * 0.5));
        c.stroke();
        c.globalAlpha = a * 0.28;
        c.fillStyle = p.color;
        c.fill();
      } else if (p.kind === 'spark') {
        c.fillStyle = p.color;
        circle(c, p.x, p.y, p.size * 0.7);
        c.fill();
      } else {
        c.fillStyle = p.color;
        if (p.glow) {
          c.globalAlpha = a * 0.35;
          circle(c, p.x, p.y, p.size * 1.9);
          c.fill();
          c.globalAlpha = a;
        }
        circle(c, p.x, p.y, p.size * (0.4 + a * 0.8));
        c.fill();
      }
    }
    c.restore();
  }

  function drawTexts(c) {
    c.save();
    for (let i = 0; i < texts.length; i++) {
      const t = texts[i];
      const a = clamp(t.life / t.max, 0, 1);
      const sc = 1 + (1 - a) * 0.12;
      c.globalAlpha = Math.min(1, a * 1.5);
      c.save();
      c.translate(t.x, t.y);
      c.scale(sc, sc);
      drawTxt(t.str, 0, 0, t.size, t.color, 'center', 900, 7);
      c.restore();
    }
    c.restore();
  }

  /* ===================================================================
     23. HUD
     =================================================================== */
  function drawHUD(c) {
    // 关卡徽章
    drawPill(10, 10, 140, 48, 'rgba(18,12,40,0.45)');
    drawTxt('第 ' + (Game.level + 1) + ' 关', 80, 35, 24, '#ffe066', 'center', 900, 5);

    // 星星计数
    drawPill(158, 10, 118, 48, 'rgba(18,12,40,0.45)');
    c.save();
    c.translate(184, 34);
    c.fillStyle = '#ffd93d';
    drawStarShape(c, 0, 0, 13, 5, 0.46, Math.sin(Game.t * 2) * 0.15);
    c.fill();
    c.strokeStyle = '#e8a300'; c.lineWidth = 2; c.stroke();
    c.restore();
    drawTxt('×' + Game.stars, 204, 35, 24, '#ffffff', 'left', 900, 4);

    // 爱心
    for (let i = 0; i < player.maxHp; i++) {
      drawHeart(c, 30 + i * 30, 78, 24, i < player.hp);
    }

    // 当前武器
    const wDef = WEAPONS[player.weapon];
    drawPill(286, 64, 240, 36, 'rgba(18,12,40,0.42)');
    c.save();
    c.translate(306, 82);
    if (player.weapon === 1) {
      c.fillStyle = '#6fd3ff';
      circle(c, -5, 0, 5); c.fill();
      circle(c, 5, 0, 5); c.fill();
    } else if (player.weapon === 2) {
      const cols = ['#ff6b6b', '#ffd166', '#8ef7c1'];
      for (let k = 0; k < 3; k++) {
        c.strokeStyle = cols[k]; c.lineWidth = 3;
        c.beginPath(); c.arc(0, 4, 10 - k * 3, Math.PI, TAU); c.stroke();
      }
    } else if (player.weapon === 3) {
      c.fillStyle = '#ffe066';
      c.beginPath();
      c.moveTo(2, -11); c.lineTo(-6, 1); c.lineTo(0, 1); c.lineTo(-2, 11); c.lineTo(7, -2); c.lineTo(1, -2);
      c.closePath(); c.fill();
    } else {

  /* ===================================================================

  const UI = { buttons: [], pressed: null, pressT: 0 };

  function syncButtons() {
    const B = [];
    const prevPress = {};
    for (let i = 0; i < UI.buttons.length; i++) {
      if (UI.buttons[i].press) prevPress[UI.buttons[i].id] = UI.buttons[i].press;
    }
    function add(id, x, y, w, h, label, kind, action, fs) {
      B.push({ id: id, x: x, y: y, w: w, h: h, label: label, kind: kind, action: action, fs: fs, press: prevPress[id] || 0 });
    }

    if (Game.state === 'title') {
      add('start', W / 2 - 150, 596, 300, 96, '开始冒险', 'primary', startGame, 40);
      add('sound', 56, 728, 200, 66, Save.data.muted ? '🔇 声音关' : '🔊 声音开', 'ghost', function () {
        Sound.setMuted(!Save.data.muted);
        Sound.play('click');
      }, 24);
      add('mode', 288, 728, 200, 66, Save.data.challenge ? '挑战模式' : '简单模式', Save.data.challenge ? 'pink' : 'sky', function () {
        Save.data.challenge = !Save.data.challenge;
        Save.flush();
        Sound.play('click');
      }, 24);
      add('help', W / 2 - 96, 812, 192, 54, '玩法说明', 'ghost', function () { Game.state = 'help'; }, 22);
    } else if (Game.state === 'help') {
      add('back', W / 2 - 120, 646, 240, 82, '知道啦', 'primary', function () { Game.state = 'title'; }, 32);
    } else if (Game.state === 'playing' || Game.state === 'bossdown' || Game.state === 'tutorial') {
      add('pause', 452, 8, 74, 52, '', 'ghost', function () { pauseGame(false); }, 1);
      add('sound2', 372, 8, 74, 52, Save.data.muted ? '🔇' : '🔊', 'ghost', function () {
        Sound.setMuted(!Save.data.muted);
        Sound.play('click');
      }, 22);
    } else if (Game.state === 'paused') {
      add('resume', W / 2 - 140, 420, 280, 88, '继续冒险', 'primary', resumeGame, 34);
      add('restart', W / 2 - 140, 526, 280, 74, '重新开始', 'sky', restartGame, 28);
      add('sound3', W / 2 - 140, 616, 132, 66, Save.data.muted ? '🔇 关' : '🔊 开', 'ghost', function () {
        Sound.setMuted(!Save.data.muted);
        Sound.play('click');
      }, 22);
      add('home', W / 2 + 8, 616, 132, 66, '回主页', 'ghost', backToTitle, 22);
    } else if (Game.state === 'clear') {
      const isLast = Game.level + 1 >= LEVELS.length;
      add('next', W / 2 - 145, 686, 290, 92, isLast ? '领取奖章' : '下一关', 'primary', nextLevel, 36);
    } else if (Game.state === 'continue') {
      add('cont', W / 2 - 145, 560, 290, 92, '继续冒险', 'primary', continueGame, 36);
      add('restart2', W / 2 - 110, 668, 220, 62, '重新开始', 'ghost', restartGame, 24);

      add('again', W / 2 - 145, 662, 290, 88, '再玩一次', 'primary', function () { startGame(); }, 34);

  /* ===================================================================
     26. 渲染主函数
     =================================================================== */
  function render() {
    ctx.setTransform(kScale, 0, 0, kScale, 0, 0);
    ctx.save();

    // 屏震
    if (Game.shake > 0.001) {
      const s = Game.shake * 9;
      ctx.translate(rand(-s, s), rand(-s, s));
    }

    BG.draw(ctx);

    if (Game.state === 'title' || Game.state === 'help') {
      drawTitle(ctx);
      if (Game.state === 'help') drawHelp(ctx);
    } else {
      // 实体
      drawPickups(ctx);
      for (let i = 0; i < enemies.length; i++) drawEnemy(ctx, enemies[i]);
      drawBoss(ctx);
      drawBeam(ctx);
      drawPlayer(ctx);
      drawBullets(ctx);
      drawEBullets(ctx);
      drawParticles(ctx);
      drawTexts(ctx);

      drawHUD(ctx);

      if (Game.state === 'tutorial') drawTutorial(ctx);
      if (Game.state === 'paused') drawPauseOverlay(ctx);
      if (Game.state === 'clear') { drawClearOverlay(ctx); drawParticles(ctx); }
      if (Game.state === 'continue') drawContinueOverlay(ctx);
      if (Game.state === 'win') drawWinOverlay(ctx);
    }

    // 按钮
    for (let i = 0; i < UI.buttons.length; i++) {
      const b = UI.buttons[i];
      if (!b.label) continue;
      drawBtn(b);
    }

    // 受伤柔光（不刺眼）
    if (Game.flash > 0.01) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.72);
      g.addColorStop(0, 'rgba(255,120,160,0)');
      g.addColorStop(1, 'rgba(255,120,160,' + (Game.flash * 0.55) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  /* ===================================================================
     27. 状态切换
     =================================================================== */
  function pauseGame(auto) {
    if (Game.state !== 'playing' && Game.state !== 'tutorial' && Game.state !== 'bossdown') return;
    Game.pausedFrom = Game.state;
    Game.state = 'paused';
    inputReset();
  }

  function resumeGame() {
    Game.state = Game.pausedFrom || 'playing';
    Game.pausedFrom = null;
    Sound.resume();
    inputReset();
  }

  function restartGame() {
    Game.pausedFrom = null;
    startGame();
  }

  /* ===================================================================
     28. 输入回调
     =================================================================== */
  function onPointerDown(x, y) {
    Sound.resume();
    for (let i = UI.buttons.length - 1; i >= 0; i--) {
      const b = UI.buttons[i];
      const pad = 10;
      if (x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad) {
        b.press = 1;
        UI.pressed = b;
        UI.pressT = 0.1;
        Sound.play('click');
        if (b.action) b.action();
        return;
      }
    }
    if (Game.state === 'playing' || Game.state === 'tutorial') {
      beginDrag(x, y);
    }
  }

  function onPointerMove(x, y) {
    if (Game.state === 'playing' || Game.state === 'tutorial') moveDrag(x, y);
  }

  function onPointerUp() {
    Game.dragging = false;
    if (UI.pressed) { UI.pressed.press = 0; UI.pressed = null; }
  }

  /* ===================================================================
     29. 主循环
     =================================================================== */
  function update(dt) {
    Game.t += dt;
    Game.stats.ticks++;
    BG.update(dt);
    Game.shake = Math.max(0, Game.shake - dt * 2.4);
    Game.flash = Math.max(0, Game.flash - dt * 2.2);
    if (Game.bannerT > 0) Game.bannerT -= dt;
    if (UI.pressT > 0) {
      UI.pressT -= dt;
      if (UI.pressT <= 0) {
        for (let i = 0; i < UI.buttons.length; i++) UI.buttons[i].press = 0;
      }
    }

    if (Game.state === 'tutorial') {
      Game.tutT += dt;
      updatePlayer(dt);
      updateBullets(dt);
      updateParticles(dt);
      if (Game.tutT > 9 && Game.state === 'tutorial') {
        Game.state = 'playing';
        Game.tutHint = false;
      }
      return;
    }

    if (Game.state === 'playing') {
      Game.dropT -= dt;
      updatePlayer(dt);
      updateBeam(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updateBoss(dt);
      updateEBullets(dt);
      updatePickups(dt);
      checkCollisions();
      if (Game.state === 'playing') updateSpawn(dt);
    } else if (Game.state === 'bossdown') {
      updateBullets(dt);
      updateEnemies(dt);
      updateEBullets(dt);
      updatePickups(dt);
      updateBoss(dt);
      Game.bossDownT -= dt;
      if (Game.bossDownT <= 0) {
        Game.state = 'clear';
        Game.clearT = 0;
        Game.score += 50 + Game.starsLevel * 2;
        Sound.play('clear');
        burst(W / 2, 400, '#ffe066', 30, 'star', 1.4);
        burst(W / 2, 400, '#ff8ac4', 24, 'star', 1.2);
      }
    } else if (Game.state === 'clear') {
      Game.clearT += dt;
      updateParticles(dt);
      if (Math.random() < dt * 2.2) {
        burst(rand(60, W - 60), rand(300, 700), pick(['#ffe066', '#ff8ac4', '#7ee8ff', '#8ef7c1']), 4, 'star', 0.9);
      }
    } else if (Game.state === 'win') {
      Game.clearT += dt;
      updateParticles(dt);
      if (Math.random() < dt * 2.6) {
        burst(rand(60, W - 60), rand(240, 720), pick(['#ffe066', '#ff8ac4', '#7ee8ff', '#8ef7c1']), 4, 'star', 1);
      }
    } else if (Game.state === 'continue') {
      updateParticles(dt);
      updateEBullets(dt);
    }

    if (Game.state !== 'paused') updateParticles(dt);
  }

  let lastT = 0;
  let acc = 0;
  let fpsT = 0, frames = 0;
  Game.fps = 60;

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastT) lastT = now;
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0.0005) dt = 0.016;
    Game.dt = dt;
    frames++;
    fpsT += dt;
    if (fpsT >= 0.5) { Game.fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    syncButtons();
    update(dt);
    render();
  }

  /* ===================================================================
     30. 启动
     =================================================================== */
  function boot() {
    resize();
    BG.set(0);
    Game.state = 'title';
    Sound.setMuted(Save.data.muted);
    requestAnimationFrame(frame);
  }

  // 首次交互解锁音频
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, function () { Sound.resume(); }, { once: true, passive: true });
  });

  window.addEventListener('error', function (e) {
    Game.lastError = e && e.message ? e.message : 'error';
  });

  // 调试接口（便于自动化验收）
  window.__RJ = {
    Game: Game, player: player, enemies: enemies, ebullets: ebullets,
    bullets: bullets, pickups: pickups, particles: particles, UI: UI,
    startGame: startGame, startLevel: startLevel, nextLevel: nextLevel,
    spawnBoss: spawnBoss, damageBoss: damageBoss, hurtPlayer: hurtPlayer,
    pauseGame: pauseGame, resumeGame: resumeGame, restartGame: restartGame,
    collectPickup: collectPickup, spawnEnemy: spawnEnemy,
    setState: function (s) { Game.state = s; },
    save: Save
  };

  boot();
})();

</script>
</body>
</html>
